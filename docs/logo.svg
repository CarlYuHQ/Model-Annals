<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Model Annals logo: token inputs through a wide hidden layer to a predicted output token">
  <defs><clipPath id="t"><rect x="8" y="8" width="224" height="224" rx="56"/></clipPath></defs>
  <g clip-path="url(#t)">
    <rect x="8" y="8" width="224" height="224" rx="56" fill="#1c2147"/>
    <rect x="8.75" y="8.75" width="222.5" height="222.5" rx="55.25" fill="none" stroke="#fdfdfb" stroke-opacity=".18" stroke-width="1.5"/>
  </g>

  <!-- sparse, readable layer connections -->
  <g fill="none" stroke="#fdfdfb" stroke-opacity=".32" stroke-width="1.6" stroke-linecap="round">
    <path d="M58 84 L112 68 M58 84 L112 96"/>
    <path d="M58 120 L112 96 M58 120 L112 124 M58 120 L112 152"/>
    <path d="M58 156 L112 152 M58 156 L112 180"/>
    <path d="M112 68 L176 88 M112 68 L176 120"/>
    <path d="M112 96 L176 120 M112 96 L176 152"/>
    <path d="M112 124 L176 88 M112 124 L176 120 M112 124 L176 152"/>
    <path d="M112 152 L176 120 M112 152 L176 152"/>
    <path d="M112 180 L176 152"/>
  </g>

  <!-- input tokens -->
  <g fill="#fdfdfb">
    <rect x="48" y="74" width="20" height="20" rx="5"/>
    <rect x="48" y="110" width="20" height="20" rx="5"/>
    <rect x="48" y="146" width="20" height="20" rx="5"/>
  </g>
  <g stroke="#1c2147" stroke-opacity=".5" stroke-width="1.7" stroke-linecap="round">
    <path d="M53 81 h10 M53 87 h7"/>
    <path d="M53 117 h10 M53 123 h7"/>
    <path d="M53 153 h10 M53 159 h7"/>
  </g>

  <!-- wide hidden layer -->
  <g fill="#fdfdfb">
    <circle cx="112" cy="68" r="6"/><circle cx="112" cy="96" r="6"/>
    <circle cx="112" cy="124" r="6"/><circle cx="112" cy="152" r="6"/>
    <circle cx="112" cy="180" r="6"/>
  </g>

  <!-- output layer, next token highlighted -->
  <g fill="#fdfdfb">
    <circle cx="176" cy="88" r="6"/><circle cx="176" cy="152" r="6"/>
  </g>
  <circle cx="176" cy="120" r="10" fill="#d7303b"/>
  <circle cx="176" cy="120" r="14.5" fill="none" stroke="#d7303b" stroke-opacity=".5" stroke-width="1.6"/>

  <!-- red pen underline -->
  <path d="M62 208 C 104 204, 146 210, 178 206" fill="none" stroke="#d7303b" stroke-width="4" stroke-linecap="round"/>
</svg>
