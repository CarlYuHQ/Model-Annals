<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型家谱 · 大模型发展全景档案</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
.fam-select{display:flex;gap:8px;flex-wrap:wrap}
.fam-select .chip{font-size:11px}
.family-tip{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:20px}
.gen-node{cursor:pointer}
.gen-node:hover{border-color:var(--accent)}
.gen-node.branch-off{border-style:dashed}
.legend-inline{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:22px}
</style>
</head>
<body>
<header id="masthead"></header>
<div id="navbar"></div>

<main class="wrap">
  <div class="section" style="padding-bottom:20px">
    <span class="kicker">视图 03 / 模型家谱</span>
    <h1 style="margin:14px 0 18px">谱系</h1>
    <p class="lede">每个模型都可能有一个前代。沿着 <span class="mono">predecessor</span> 关系往上追，就能看到一条产品线的演化。实线为主干，虚线为分支。</p>
  </div>

  <div class="toolbar">
    <span class="label">选择谱系</span>
    <div class="fam-select" id="fam-select"></div>
  </div>

  <div class="legend-inline">
    <span>▮ 实线 = 主线迭代</span>
    <span>┊ 虚线框 = 旁支 / 变体</span>
    <span>左侧红边 = 该谱系最新</span>
  </div>

  <div id="family-root"></div>
</main>

<footer class="footer"><div class="wrap fg">
  <p>谱系依据公开资料中的 predecessor / 版本关系整理；分支关系在不同来源间可能不一致。<br>点击任一节点查看该模型的完整档案与来源。</p>
  <p><a href="sources.html">数据来源与说明 →</a></p>
</div></footer>

<script src="data/atlas.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const {A, esc, renderChrome, companyName, MODELS, fmtDate} = ATLAS_UI;
  renderChrome('lineage.html');

  // 按 company + family 分组
  const groups={};
  A.models.forEach(m=>{
    const key=m.company+'||'+(m.family||m.name.split(/[\s-]/)[0]);
    (groups[key]=groups[key]||[]).push(m);
  });
  const keys=Object.keys(groups).filter(k=>groups[k].length>=2)
    .sort((a,b)=>groups[b].length-groups[a].length);

  const sel=document.getElementById('fam-select');
  sel.innerHTML=keys.map((k,i)=>{
    const [c,f]=k.split('||');
    return `<button class="chip ${i===0?'on':''}" data-k="${esc(k)}">${esc(companyName(c))} · ${esc(f)} <span style="opacity:.5">${groups[k].length}</span></button>`;
  }).join('');

  function shortName(m){
    let n=m.name;
    // 去掉与公司名重复的前缀，让谱系更易读
    const c=companyName(m.company).split(/[\s·]/)[0];
    if(n.toLowerCase().startsWith(c.toLowerCase()+' ')) n=n.slice(c.length+1);
    return n.length>22?n.slice(0,21)+'…':n;
  }

  function render(key){
    const arr=[...groups[key]].sort((a,b)=>(a.release||'9999').localeCompare(b.release||'9999'));
    const latest=arr[arr.length-1];
    const ids=new Set(arr.map(m=>m.id));

    // 构建链式序列：沿 predecessor 排序，非链上的按发布日期插入
    const ordered=[];
    const byPred={};
    arr.forEach(m=>{ const p=m.predecessor&&ids.has(m.predecessor)?m.predecessor:'__root'; (byPred[p]=byPred[p]||[]).push(m); });
    function walk(node){
      const kids=(byPred[node]||[]).sort((a,b)=>(a.release||'').localeCompare(b.release||''));
      kids.forEach(k=>{ordered.push(k);walk(k.id);});
    }
    walk('__root');
    const final=ordered.length===arr.length?ordered:arr;

    const [c,f]=key.split('||');
    let html=`<div class="family-block">
      <div class="family-head">
        <h3>${esc(companyName(c))} <span style="color:var(--ink-3);font-weight:400">/ ${esc(f)}</span></h3>
        <span class="mono" style="font-size:11px;color:var(--ink-3)">${arr.length} 代 · ${shortName(arr[0])} → ${shortName(latest)}</span>
      </div>
      <div class="family-body">`;

    final.forEach((m,i)=>{
      const isBranch = m.predecessor && final.some(x=>x.id===m.predecessor) && i>0;
      const isLatest = m.id===latest.id;
      html+=`<div class="family-row">
        ${i>0?`<span class="gen-arrow">→</span>`:''}
        <div class="gen-node ${isLatest?'flag':''} ${isBranch?'':''}" data-open-model="${esc(m.id)}">
          <span class="gname">${esc(shortName(m))}</span>
          <span class="gdate">${fmtDate(m.release)} · ${m.params_b?m.params_b+'B':'参数未公开'}</span>
        </div>
        ${(m.highlights&&m.highlights[0])?`<span class="gen-branch">${esc(m.highlights[0].slice(0,34))}${m.highlights[0].length>34?'…':''}</span>`:''}
      </div>`;
    });
    html+='</div></div>';
    document.getElementById('family-root').innerHTML=html;
  }

  sel.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]'); if(!b) return;
    sel.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    render(b.dataset.k);
    window.scrollTo({top:document.querySelector('.toolbar').offsetTop-70,behavior:'smooth'});
  });

  if(keys.length) render(keys[0]);
})();
</script>
</body>
</html>
